services:
  - type: web
    name: phytovaria-backend
    env: python
    plan: free
    rootDir: project/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOW_ORIGINS
        value: "*"
